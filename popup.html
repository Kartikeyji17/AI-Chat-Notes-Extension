<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <h1>AI Chat Notes</h1>
      <p class="sub">Turn any chat into revision notes</p>
    </div>
  </div>

  <div class="wrap">
    <button id="generateBtn">
      <span id="btnText">✦ Generate notes from this chat</span>
      <span id="spinner" class="spinner"></span>
    </button>
    <div id="status"></div>

    <div class="row">
      <button id="openNotesBtn" class="secondary">📒 My notes</button>
      <button id="openOptionsBtn" class="secondary">⚙️ Settings</button>
    </div>

    <p class="tip">Select text before clicking to summarize just that part · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>U</kbd> works without opening this popup</p>
  </div>
  <script src="ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
